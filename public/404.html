<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/pizza-lab/" />
    <title>Переход на PIZZA LAB</title>
  </head>
  <body>
    <p>Открываем PIZZA LAB… <a href="/pizza-lab/">Перейти на главную</a></p>
    <script>
      const base = "/pizza-lab";
      const path = window.location.pathname;
      if (path.startsWith(base)) {
        sessionStorage.setItem("pizza-lab-redirect", path + window.location.search + window.location.hash);
      }
      window.location.replace(base + "/");
    </script>
  </body>
</html>
